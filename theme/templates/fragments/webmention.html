<form action="{{ WEBMENTION_URL }}" method="post">
<fieldset{{ " disabled" if not WEBMENTION_URL }}>
  <legend>Send a <a href="https://indieweb.org/Webmention">webmention</a></legend>
  <input type="url" id="webmention-source" name="source" placeholder="source.url/mention" required>
  <input type="hidden" name="target" value="{{ SITEURL ~ "/" ~ (article.url if article) }}">
  <input type="submit" value="Send">
</fieldset>
</form>
